<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多行文本练习</title>
    <style>
        body {
            max-width: 600px;
            margin: 48px auto;
            padding: 0 16px;
            font-family: sans-serif;
            font-size: 20px;
        }
        h1 { font-size: 32px; }
        input { padding: 8px; font: inherit; max-width: 220px; }
        button {
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            font: inherit;
            cursor: pointer;
        }
        #result { min-height: 32px; }
        button:disabled { opacity: 0.6; cursor: wait; }
    </style>
</head>
<body>
    <h1>便笺内容</h1>
    <label for="content">内容</label>
    <textarea id="content" rows="4" cols="30" placeholder="写下第一条便笺"></textarea>

</body>
</html>
