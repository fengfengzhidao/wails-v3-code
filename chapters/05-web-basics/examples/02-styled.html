<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 外观练习</title>
    <style>
        body {
            max-width: 600px;
            margin: 48px auto;
            padding: 0 16px;
            font-family: sans-serif;
            font-size: 20px;
        }
        h1 { font-size: 32px; }
        input { padding: 8px; font: inherit; max-width: 220px; }
        button {
            padding: 8px 16px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            font: inherit;
            cursor: pointer;
        }
        #result { min-height: 32px; }
        button:disabled { opacity: 0.6; cursor: wait; }
    </style>
</head>
<body>
    <h1>我的第一个交互页面</h1>
    <label for="name">姓名</label>
    <input id="name" placeholder="请输入姓名">
    <button id="greet" type="button">打招呼</button>
    <p id="result" role="status"></p>

</body>
</html>
